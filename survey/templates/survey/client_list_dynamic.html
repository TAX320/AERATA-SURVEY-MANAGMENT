{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clients — Aerata</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'survey/css/style.css' %}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4">
<a class="navbar-brand" href="{% url 'dashboard' %}">
    <img src="{% static 'survey/images/aerata-logo-white.png' %}" alt="Aerata">
</a>
<div class="ms-auto d-flex gap-2">
<a class="btn btn-outline-light" href="{% url 'dashboard' %}">Home</a>
<a class="btn btn-outline-light" href="{% url 'project_list' %}">Projects</a>
<a class="btn btn-primary" href="{% url 'client_create' %}">+ New Client</a>
</div>
</nav>

<div class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
<h2>Clients</h2>
<div class="d-flex align-items-center gap-2">
<span id="loading-indicator">Loading...</span>
<select id="sector-filter" class="form-select w-auto">
<option value="">All Sectors</option>
<option value="energy">Energy</option>
<option value="infrastructure">Infrastructure</option>
<option value="oil_gas">Oil & Gas</option>
<option value="surveying">Surveying & Mapping</option>
<option value="agriculture">Agriculture</option>
<option value="other">Other</option>
</select>
</div>
</div>

<div class="row" id="client-results">
{% include "survey/_client_cards.html" %}
</div>
</div>

<footer class="aerata-footer">
    <img src="{% static 'survey/images/aerata-logo-white.png' %}" alt="Aerata" class="footer-logo">
    <div class="footer-text">AERATA B.V. · info@aerata.com · aerata.com</div>
</footer>

<script src="{% static 'survey/js/main.js' %}" data-filter-url="{% url 'client_list_partial' %}"></script>

</body>
</html>
