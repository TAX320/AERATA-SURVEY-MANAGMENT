{% for project in projects %}
<tr>
<td>{{ project.title }}</td>
<td>{{ project.client.name }}</td>
<td>{{ project.service_type.name }}</td>
<td><span class="badge badge-{{ project.status }}">{{ project.get_status_display }}</span></td>
<td>{{ project.area_km2|default:"—" }}</td>
<td>{{ project.requested_date }}</td>
<td><a href="{% url 'project_detail' project.pk %}" class="btn btn-sm btn-outline-light">View</a></td>
</tr>
{% empty %}
<tr>
<td colspan="7" class="text-center text-secondary py-4">No projects found.</td>
</tr>
{% endfor %}
